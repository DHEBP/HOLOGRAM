name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.1) — creates a draft release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  changelog-guard:
    name: CHANGELOG entry present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a CHANGELOG section for this version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          # Same extraction the release job uses for the notes body — guard it here
          # so a missing section fails in seconds instead of after a full build.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md — the release would publish with empty notes. Add the entry before tagging."
            exit 1
          fi
          echo "Found CHANGELOG entry for $VERSION."

          FILE_VER=$(tr -d '[:space:]' < VERSION)
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "::error::VERSION file is '$FILE_VER' but tag is 'v$VERSION' — bump VERSION (and CHANGELOG) before tagging."
            exit 1
          fi
          echo "VERSION file matches tag."

  build:
    name: Build ${{ matrix.platform }}
    needs: changelog-guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
            wails_platform: linux/amd64
            archive_ext: tar.gz
          - platform: linux-arm64
            runner: ubuntu-22.04
            wails_platform: linux/arm64
            archive_ext: tar.gz
          - platform: windows-amd64
            runner: windows-latest
            wails_platform: windows/amd64
            archive_ext: zip
          - platform: darwin-universal
            runner: macos-latest
            wails_platform: darwin/universal
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned to match the Makefile's DEROD_TOOLCHAIN. go.mod's own floor
          # (go 1.25.0) would otherwise let GOTOOLCHAIN=auto silently fetch a
          # newer Go release here — 1.27.0 hit a reproducible internal compiler
          # error building this exact codebase, so don't leave this floating.
          go-version: "1.26.5"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux UI dependencies (amd64)
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev

      - name: Install Linux UI dependencies (arm64 cross-compile)
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libglib2.0-dev:arm64 libwebkit2gtk-4.1-dev:arm64 \
            pkg-config

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build derod
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          case "${{ matrix.platform }}" in
            linux-amd64)
              GOOS=linux GOARCH=amd64 make derod
              ;;
            linux-arm64)
              GOOS=linux GOARCH=arm64 make derod
              ;;
            windows-amd64)
              GOOS=windows GOARCH=amd64 make derod
              ;;
            darwin-universal)
              # Makefile's derod target is a plain `go build`, not wails' universal
              # binary — build both arches and glue them together the same way.
              GOOS=darwin GOARCH=amd64 make derod
              mv build/bin/derod-darwin build/bin/derod-darwin-amd64
              GOOS=darwin GOARCH=arm64 make derod
              mv build/bin/derod-darwin build/bin/derod-darwin-arm64
              lipo -create -output build/bin/derod-darwin \
                build/bin/derod-darwin-amd64 build/bin/derod-darwin-arm64
              ;;
          esac

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version=$VERSION, sha=$SHORT_SHA)"

      - name: Build HOLOGRAM (Wails)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          CC: ${{ matrix.platform == 'linux-arm64' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX: ${{ matrix.platform == 'linux-arm64' && 'aarch64-linux-gnu-g++' || '' }}
          # Linux links against webkit2gtk-4.1 (libsoup3); 4.0 is gone from all
          # current distros. Matches the Makefile default. Must stay empty on
          # Windows/macOS — this build step is shared across the whole matrix.
          WAILS_TAGS: ${{ startsWith(matrix.platform, 'linux') && '-tags webkit2_41' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.platform == 'linux-arm64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
        run: |
          LDFLAGS="-X main.AppVersion=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${SHORT_SHA}"
          wails build -platform ${{ matrix.wails_platform }} ${WAILS_TAGS} -ldflags "$LDFLAGS" -clean -trimpath

      - name: Verify Linux binary links webkit2gtk-4.1, not the dead 4.0
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          # The 4.0 binding (libsoup2) is gone from every current distro, so a
          # binary that NEEDs libwebkit2gtk-4.0.so.* builds fine in CI but fails
          # to start on users' machines. objdump reads the ELF dynamic section
          # statically, so it works for the cross-compiled arm64 artifact too.
          NEEDED=$(objdump -p build/bin/Hologram | awk '/NEEDED/ {print $2}')
          echo "$NEEDED" | grep -E 'webkit2gtk' || true
          if echo "$NEEDED" | grep -q 'libwebkit2gtk-4\.0'; then
            echo "::error::Linux binary links libwebkit2gtk-4.0 (libsoup2), which is absent on modern distros. Build must use -tags webkit2_41 against libwebkit2gtk-4.1-dev."
            exit 1
          fi
          if ! echo "$NEEDED" | grep -q 'libwebkit2gtk-4\.1'; then
            echo "::error::Linux binary does not link libwebkit2gtk-4.1 at all — webkit binding missing or build misconfigured."
            exit 1
          fi
          echo "OK: links libwebkit2gtk-4.1."

      - name: Package artifact (Linux amd64)
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="HOLOGRAM-v${VERSION}-linux-amd64"
          # Ship a folder with the binary + a user-level installer (.desktop launcher +
          # icon) so double-click / app-menu work — a bare binary does neither on Linux.
          mkdir -p "build/bin/${STAGE}"
          cp build/bin/Hologram "build/bin/${STAGE}/Hologram"
          chmod +x "build/bin/${STAGE}/Hologram"
          # Bundled node: HOLOGRAM already prefers a derod already on the user's
          # PATH/$HOME/system dirs if one exists — this is the fallback for
          # someone with nothing installed, not a forced replacement.
          cp build/bin/derod-linux-amd64 "build/bin/${STAGE}/derod-linux-amd64"
          chmod +x "build/bin/${STAGE}/derod-linux-amd64"
          cp build/linux/install.sh build/linux/uninstall.sh "build/bin/${STAGE}/"
          chmod +x "build/bin/${STAGE}/install.sh" "build/bin/${STAGE}/uninstall.sh"
          cp build/appicon.png "build/bin/${STAGE}/appicon.png"
          cp build/linux/README-linux.md "build/bin/${STAGE}/README.md"
          cd build/bin
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la

      - name: Package artifact (Linux arm64)
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="HOLOGRAM-v${VERSION}-linux-arm64"
          mkdir -p "build/bin/${STAGE}"
          cp build/bin/Hologram "build/bin/${STAGE}/Hologram"
          chmod +x "build/bin/${STAGE}/Hologram"
          cp build/bin/derod-linux-arm64 "build/bin/${STAGE}/derod-linux-arm64"
          chmod +x "build/bin/${STAGE}/derod-linux-arm64"
          cp build/linux/install.sh build/linux/uninstall.sh "build/bin/${STAGE}/"
          chmod +x "build/bin/${STAGE}/install.sh" "build/bin/${STAGE}/uninstall.sh"
          cp build/appicon.png "build/bin/${STAGE}/appicon.png"
          cp build/linux/README-linux.md "build/bin/${STAGE}/README.md"
          cd build/bin
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          cd build/bin
          $archive = "HOLOGRAM-v${{ steps.version.outputs.version }}-windows-amd64.zip"
          Compress-Archive -Path "Hologram.exe","derod.exe" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii
          Get-ChildItem

      - name: Package artifact (macOS)
        if: matrix.platform == 'darwin-universal'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="HOLOGRAM-v${VERSION}-macos-universal"
          mkdir -p "build/bin/${STAGE}"
          cp -R "build/bin/Hologram.app" "build/bin/${STAGE}/Hologram.app"
          cp build/bin/derod-darwin "build/bin/${STAGE}/derod-darwin"
          chmod +x "build/bin/${STAGE}/derod-darwin"
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent "${STAGE}" "${STAGE}.zip"
          shasum -a 256 "${STAGE}.zip" > "${STAGE}.zip.sha256"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hologram-${{ matrix.platform }}
          path: |
            build/bin/HOLOGRAM-v*.tar.gz
            build/bin/HOLOGRAM-v*.zip
            build/bin/HOLOGRAM-v*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract the section between "## [VERSION]" and the next "## ["
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          echo "Release notes extracted:"
          cat release_notes.md

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HOLOGRAM ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/HOLOGRAM-v*.tar.gz
            dist/HOLOGRAM-v*.zip
            dist/HOLOGRAM-v*.sha256
