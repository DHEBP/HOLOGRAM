<!DOCTYPE html>
<!--
  Consent probe — a local dApp that reaches for every gated door, one button at a time.

  It exists because the doors could not be checked without an app that calls them: villager.tela
  never calls GetBalance and never subscribes, so view_balance and the Subscribe branch shipped
  unexercised. Reading the code is not the same as watching the prompt appear.

  Load it:  Browser → local dev server → point it at testdata/consent-probe
            (the server requires an index.html, which is why this is a directory)

  It speaks XSWD over a WebSocket, which is what a real dApp does — HOLOGRAM's injected bridge
  intercepts the socket and routes it through the same consent gate villager.tela hits. It
  deliberately does NOT use telaHost.call(): in integrated-wallet mode that path refuses wallet
  methods outright (app.go CallXSWD), so it would exercise nothing.

  What to expect, if consent is behaving:
    Connect            ONE prompt, "Public Data Only", no checkboxes
    Chain tip          never prompts — public data, rides the connect grant
    Address            prompts; "Always allow" and it stays quiet afterwards
    Balance            prompts SEPARATELY from address — different doors
    Transfers          no new prompt once balance is allowed — same door
    Subscribe balance  prompts for the balance door if not already allowed
    Deny anything      arrives as -32043, not a generic failure
    Switch wallets     every wallet door asks AGAIN, and a running feed goes quiet

  That last line is the one worth the trouble: a door remembered under one wallet must not
  open for the next one.

  STORAGE GAS — the two SC write buttons, which need a contract and an SCID pasted in.

  A contract call is charged for what it stores and the fee attached IS that budget, so two
  different things can go wrong and only one is about money. Both are fixed in HOLOGRAM's own
  screens; a dApp arriving here reaches none of those checks, which is why they are exercised
  from an actual socket rather than by reading the code.

    Write 5 KB    approve it → OK with a txid. The console shows the transaction being
                  rebuilt with a larger fee first; without that the write mines and stores
                  NOTHING while this button still reports success.
    Write 12 KB   REFUSED before broadcast, with a byte count and no txid. Over the chain's
                  per-call ceiling no fee can help — attaching more is clamped away — so
                  funding it would only pay for the funeral.

  A txid coming back from the 12 KB button is the failure this exists to catch.

  Deploy a target contract on the simulator (its SetVar stores the argument verbatim, and it
  has NO owner check — an owner gate makes the estimate fail, the guard fail open, and every
  size sail through, which reads on screen as "the guard is broken"):

    Function Initialize() Uint64
    10 RETURN 0
    End Function

    Function SetVar(k String, v String) Uint64
    10 STORE("var_" + k, v)
    20 RETURN 0
    End Function
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consent Probe</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0b0f14; color:#c6d4e1; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; padding:22px; }
  h1 { font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:#5ec8f0; margin:0 0 3px; }
  p.sub { margin:0 0 18px; color:#6b7d8f; }
  .row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  button { background:#101822; color:#5ec8f0; border:1px solid #1e3242; padding:7px 11px; cursor:pointer; font:inherit; border-radius:3px; }
  button:hover:not(:disabled) { border-color:#5ec8f0; }
  button:disabled { color:#3d4c5a; border-color:#16222c; cursor:not-allowed; }
  button .d { color:#4a5b6b; }
  input { background:#070a0e; color:#c6d4e1; border:1px solid #1e3242; border-radius:3px;
          padding:7px 9px; font:inherit; min-width:34em; }
  input:focus { outline:none; border-color:#5ec8f0; }
  #log { background:#070a0e; border:1px solid #1e3242; border-radius:3px; padding:11px; height:50vh; overflow:auto; white-space:pre-wrap; }
  .ok{color:#4ad38a} .no{color:#f0704a} .dim{color:#6b7d8f} .ev{color:#e0b341} .hi{color:#5ec8f0}
</style>
</head>
<body>
<h1>Consent Probe</h1>
<p class="sub">One door per button. Watch which raise a prompt and which stay silent.</p>

<div class="row">
  <button id="connect">1 · Connect</button>
  <button class="gated" disabled id="tip">Chain tip <span class="d">public</span></button>
  <button class="gated" disabled id="addr">Address <span class="d">view_address</span></button>
  <button class="gated" disabled id="bal">Balance <span class="d">view_balance</span></button>
  <button class="gated" disabled id="xfers">Transfers <span class="d">view_balance</span></button>
</div>
<div class="row">
  <button class="gated" disabled id="subbal">Subscribe balance</button>
  <button class="gated" disabled id="subtip">Subscribe chain tip</button>
  <button class="gated" disabled id="unsub">Unsubscribe all</button>
  <button id="clear">Clear log</button>
</div>

<div class="row">
  <input id="scid" placeholder="SCID of a contract with SetVar(k,v)" spellcheck="false">
  <button class="gated" disabled id="sc5k">Write 5 KB <span class="d">should store</span></button>
  <button class="gated" disabled id="sc12k">Write 12 KB <span class="d">should refuse</span></button>
</div>

<div id="log"></div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  function say(msg, cls) {
    var line = document.createElement('div');
    if (cls) { line.className = cls; }
    line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  var ws = null;
  var nextId = 0;
  var pending = {};   // id -> label

  function gated(enabled) {
    var all = document.querySelectorAll('.gated');
    for (var i = 0; i < all.length; i++) { all[i].disabled = !enabled; }
  }

  // A refusal must arrive as -32043 so an app can tell "the user said no" from "the call
  // broke". Anything else here is a finding, not a nuisance.
  function report(label, msg) {
    if (msg.error) {
      if (msg.error.code === -32043) {
        say(label + '  DENIED  -32043  ' + (msg.error.message || ''), 'no');
      } else {
        say(label + '  FAILED  ' + msg.error.code + '  ' + (msg.error.message || ''), 'no');
      }
      return;
    }
    say(label + '  OK  ' + JSON.stringify(msg.result), 'ok');
  }

  function send(label, method, params) {
    if (!ws || ws.readyState !== 1) { say('not connected', 'no'); return; }
    var id = ++nextId;
    pending[id] = label;
    say(label + '  → ' + method, 'dim');
    ws.send(JSON.stringify({ jsonrpc: '2.0', id: id, method: method, params: params || {} }));
  }

  document.getElementById('connect').onclick = function () {
    if (ws) { try { ws.close(); } catch (e) {} }
    say('opening XSWD socket…', 'dim');
    ws = new WebSocket('ws://127.0.0.1:44326/xswd');

    ws.onopen = function () {
      say('socket open — sending handshake', 'dim');
      // Canonical XSWD handshake: a plain object, no method field.
      ws.send(JSON.stringify({
        name: 'Consent Probe',
        description: 'Exercises every gated XSWD door',
        url: window.location.href
      }));
    };

    ws.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { say('unparseable: ' + e.data, 'no'); return; }

      // Handshake reply carries accepted/message rather than a JSON-RPC id.
      if (msg.accepted !== undefined) {
        if (msg.accepted) {
          say('CONNECTED — expected exactly one prompt, public data only', 'hi');
          gated(true);
        } else {
          say('connect refused: ' + (msg.message || ''), 'no');
          gated(false);
        }
        return;
      }

      // A notification (no id) is a subscription event.
      if (msg.id === undefined || msg.id === null) {
        say('EVENT  ' + msg.method + '  ' + JSON.stringify(msg.params), 'ev');
        return;
      }

      // pending holds a plain label for the simple doors, or {label, expectRefusal} for the
      // SC writes, which are judged against what each is supposed to do rather than by
      // whether the call errored.
      var slot = pending[msg.id];
      delete pending[msg.id];
      if (slot && typeof slot === 'object') {
        scReport(slot.label, slot.expectRefusal, msg);
        return;
      }
      report(slot || ('id ' + msg.id), msg);
    };

    ws.onerror = function () { say('socket error', 'no'); };
    ws.onclose = function () { say('socket closed', 'dim'); gated(false); };
  };

  document.getElementById('tip').onclick   = function () { send('chain tip', 'DERO.GetHeight'); };
  document.getElementById('addr').onclick  = function () { send('address', 'GetAddress'); };
  document.getElementById('bal').onclick   = function () { send('balance', 'GetBalance'); };
  document.getElementById('xfers').onclick = function () { send('transfers', 'GetTransfers', { in: true, out: true }); };

  document.getElementById('subbal').onclick = function () { send('subscribe balance', 'Subscribe', { event: 'new_balance' }); };
  document.getElementById('subtip').onclick = function () { send('subscribe tip', 'Subscribe', { event: 'new_topoheight' }); };
  document.getElementById('unsub').onclick  = function () {
    send('unsub balance', 'Unsubscribe', { event: 'new_balance' });
    send('unsub tip', 'Unsubscribe', { event: 'new_topoheight' });
    send('unsub entry', 'Unsubscribe', { event: 'new_entry' });
  };

  // A storage refusal is a PASS on the 12 KB button and a FAIL on the 5 KB one, so the two
  // are reported against what each is supposed to do rather than by whether the call errored.
  // The tell is the message, not the code: a refusal comes back as an ordinary call failure,
  // the same shape as any other rejected wallet call.
  function scReport(label, expectRefusal, msg) {
    var refused = !!(msg.error && /storage gas/i.test(msg.error.message || ''));
    var txid = msg.result && (msg.result.txid || msg.result.TXID);

    if (expectRefusal) {
      if (refused) { say(label + '  REFUSED as it should be — ' + msg.error.message, 'ok'); return; }
      if (txid) {
        say(label + '  ✗ BROADCAST A DOOMED WRITE  txid ' + txid +
            '  — over the ceiling, so this mines, charges, and stores nothing', 'no');
        return;
      }
      say(label + '  ✗ expected a storage refusal, got: ' + JSON.stringify(msg.error || msg.result), 'no');
      return;
    }

    if (refused) { say(label + '  ✗ refused a write that SHOULD fit — ' + msg.error.message, 'no'); return; }
    report(label, msg);
    if (txid) { say('        now confirm it actually STORED — a txid only means it was sent', 'dim'); }
  }

  function scWrite(label, key, bytes, expectRefusal) {
    var scid = (document.getElementById('scid').value || '').trim();
    if (scid.length !== 64) { say('paste a 64-character SCID first', 'no'); return; }
    var id = ++nextId;
    pending[id] = { label: label, expectRefusal: expectRefusal };
    say(label + '  → scinvoke  SetVar(' + key + ', ' + bytes + ' bytes)', 'dim');
    ws.send(JSON.stringify({
      jsonrpc: '2.0', id: id, method: 'scinvoke',
      params: {
        scid: scid,
        ringsize: 2,
        sc_rpc: [
          { name: 'entrypoint', datatype: 'S', value: 'SetVar' },
          { name: 'k', datatype: 'S', value: key },
          { name: 'v', datatype: 'S', value: new Array(bytes + 1).join('A') }
        ]
      }
    }));
  }

  document.getElementById('sc5k').onclick  = function () { scWrite('SC write 5 KB', 'probe5k', 5000, false); };
  document.getElementById('sc12k').onclick = function () { scWrite('SC write 12 KB', 'probe12k', 12000, true); };

  document.getElementById('clear').onclick = function () { logEl.innerHTML = ''; };

  say('ready — click Connect', 'dim');
})();
</script>
</body>
</html>
